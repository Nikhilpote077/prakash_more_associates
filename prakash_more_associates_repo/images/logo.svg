<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <!-- Left Monogram (PM) with Architectural Geometry -->
  <g transform="translate(10, 10)">
    <!-- Square Framing Border in Accent Gold -->
    <rect x="0" y="0" width="100" height="100" fill="none" stroke="#C5A880" stroke-width="3"/>
    
    <!-- Letter P in White -->
    <path d="M 28 25 L 28 75 M 28 25 L 54 25 C 64 25 64 50 54 50 L 28 50" 
          fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="square"/>
    
    <!-- Letter M in White -->
    <path d="M 52 75 L 52 40 L 66 62 L 80 40 L 80 75" 
          fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- Vertical Divider Line in Soft Gold -->
  <line x1="135" y1="20" x2="135" y2="100" stroke="#C5A880" stroke-width="1.5" opacity="0.6"/>

  <!-- Brand Typography in Crisp Light Colors -->
  <text x="155" y="52" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#FFFFFF">PRAKASH MORE</text>
  <text x="156" y="78" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="4" fill="#C5A880">&amp; ASSOCIATES</text>
  <text x="156" y="94" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="8" font-weight="500" letter-spacing="2.5" fill="#CCCCCC">ARCHITECTURE • INTERIORS • VASTU</text>
</svg>
